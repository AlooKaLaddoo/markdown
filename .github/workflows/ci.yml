# Project CI: the full unittest suite. Runs on PRs from people and is dispatched by the AutoSE
# release job for bot branches (pushes made with GITHUB_TOKEN do not trigger workflows).
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[testing]'
      - run: python -m unittest discover -s tests -t .
